# Creates the GitHub release page for every version tag.
# Tags are only set on Gitea ("mercy-migrate tag ...") and arrive here through the push mirror.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # only on GitHub (the same file is also visible to a Gitea runner)
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
