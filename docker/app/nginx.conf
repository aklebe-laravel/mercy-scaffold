server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Performance & Uploads
    # Hardcoded values for stability in Prod/Dev
    client_max_body_size 128M;
    client_body_buffer_size 128k;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Redirect Nginx logs to stdout/stderr for Docker
    access_log /dev/stdout;
    error_log /dev/stderr;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Buffer tweaks for Large Livewire Payloads
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;

        # Performance: FastCGI caching could be added here if needed
    }

	# 1. First send Livewire explizit to PHP
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # 2. After this: the Asset-Block
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
        # if not valid, send to PHP
        try_files $uri /index.php?$query_string;
    }

	# Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
