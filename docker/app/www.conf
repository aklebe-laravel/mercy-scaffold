[www]
user = sail
group = sail
listen = /var/run/php/php-fpm.sock
listen.owner = root
listen.group = sail
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Critical Docker Logging Overrides
catch_workers_output = yes
decorate_workers_output = no
