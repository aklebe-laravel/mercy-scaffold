[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770
chown=root:sail

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=0
logfile_backups=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
# Master runs as root (needed to bind the socket), workers run as "sail" (see www.conf).
# No "-R": that flag would allow workers to run as root.
command=php-fpm -F
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
command=/bin/bash -c "php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=%(ENV_REVERB_SERVER_PORT)s"
user=sail
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:default-queue-worker]
command=php /var/www/html/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=60
user=sail
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-scheduler]
# THE ONLY PROFESSIONAL WAY: Let Laravel manage the sub-minute loops natively in RAM
command=/usr/bin/php /var/www/html/artisan schedule:work
user=sail
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[include]
# Modules can add their own programs in "<module>/docker/supervisord.conf" (independent of the PHP version).
# The old path "docker/8.5/supervisord.conf" is still read during the transition.
files = /var/www/html/Modules/*/docker/supervisord.conf /var/www/html/Modules/*/docker/8.5/supervisord.conf
