# Production server (./mercy install|update in the Mercy-Installer): only the differences.
# extends: [ setup.yaml ]   (default) - in your network: [ setup.yaml, networks/home.yaml ]
kernel:
  # domain of this instance, without http://
  domain: "mercy.my-domain.de"
  # the release to run: "auto" (setup.yaml) = the newest release on every "./mercy update".
  # Pin a real server to a release (switch: change it and run "./mercy update"):
  # version: "2.0.0"
