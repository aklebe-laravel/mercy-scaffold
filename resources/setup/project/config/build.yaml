# Production image (./mercy build): only the differences to the dev stage.
# The image can be rolled out to any domain, so it is built with the dev values (domain, ports),
# never with the domain of a production instance.
# env "production" and dev_mode false come from the Mercy build defaults (set them here again if your dev.yaml sets them).
extends: [ setup.yaml, dev.yaml ]
# The release number of the image comes from "kernel.version: auto" (setup.yaml): the next release in the registry,
# "./mercy build --tag=3" (or 2.7, 2.7.0) jumps. A fixed "kernel.version" here would replace auto for every build.
