# STRICT ENGLISH: Optimized Nginx Proxy configuration for Laravel Reverb
location / {
    # CRITICAL: Always enforce the http:// protocol schema for container pass-through
    proxy_pass http://${{host_depend_env}}:${REVERB_SERVER_PORT};

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CRITICAL: Disable proxy buffering to prevent internal cURL handshake dropouts
    proxy_buffering off;
    proxy_cache off;

    # Production timeouts for active websocket streams
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
