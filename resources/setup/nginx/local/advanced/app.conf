# Define the Docker internal DNS resolver (always 127.0.0.11)
resolver 127.0.0.11 valid=30s;

# Store the dynamic host in a variable to bypass startup DNS checks
set $vite_upstream "http://${{host_depend_env}}:${VITE_PORT}";

# 1. Vite WebSocket (HMR)
location /vite-hmr {
    proxy_pass $vite_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# 2. Vite Static Assets
location ~ ^/(@vite|@fs|resources|node_modules|Modules|storage/app/mercy-generated)/ {
    proxy_pass $vite_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location ~ ^/themes/[^/]+/resources/ {
    proxy_pass $vite_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
