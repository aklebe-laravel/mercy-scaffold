# =====================================================================
# Production compose file. Maintained here in the scaffold and shipped inside the image;
# the Mercy-Installer copies it out of the image on every "install" and "update",
# so it always matches the image version. Do not edit the copy on the server.
# =====================================================================
services:
  mercy.app:
    image: '${DOCKER_REGISTRY_IMAGE}'
    restart: always
    ports:
      - '${APP_PORT:-80}:80'
      - '${REVERB_SERVER_PORT:-27007}:${REVERB_SERVER_PORT:-27007}'
    environment:
      APP_ENV: '${APP_ENV:-production}'
      APP_DOMAIN: '${APP_DOMAIN}'
      APP_DEBUG: '${APP_DEBUG:-false}'
      DB_CONNECTION: 'mariadb'
      DB_HOST: 'mariadb'
      DB_PORT: 3306
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
      LARAVEL_SAIL: 1
      REVERB_SERVER_HOST: '0.0.0.0'
      REVERB_SERVER_PORT: '${REVERB_SERVER_PORT:-27007}'
      WWWUSER: '${WWWUSER:-1000}'
      WWWGROUP: '${WWWGROUP:-1000}'
    volumes:
      - 'laravel-storage:/var/www/html/storage'
      - './.env:/var/www/html/.env'
      # generated configs: same path on the host (installer) and in the container, like on dev
      - './storage/app/last-setup:/var/www/html/storage/app/last-setup'
      # business imports of the project repository, same path as on dev (start-container links storage/app/imports)
      - './project/business_imports:/var/www/html/project/business_imports:ro'
      # No SSH in production: the image already contains all modules and themes.
      # Modules are only updated by building and pulling a new image ("php mercy.php update").
      # Running "mercy:app require/update" inside a production container would change code that
      # is not part of a volume: it is lost on the next container recreate and differs from the image.
    networks:
      - sail
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      # CRITICAL: Route the external domain directly to the NPM container/LXC IP.
      # This allows the PHP container to successfully verify the SSL certificate!
      - "${REVERB_HOST}:${DETECTED_NPM_IP:-127.0.0.1}"
      # - "${REVERB_HOST}:host-gateway"

  mariadb:
    image: 'mariadb:11'
    ports:
      # Bound to localhost only. The app reaches the DB via the "sail" network.
      - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
    restart: always
    environment:
      # Falls back to DB_PASSWORD; set DB_ROOT_PASSWORD in .env for a separate root password
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-${DB_PASSWORD}}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'prod-mariadb:/var/lib/mysql'
    networks:
      - sail
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 2s

  redis:
    image: 'redis:alpine'
    restart: always
    volumes:
      - 'prod-redis:/data'
    networks:
      - sail
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 2s

networks:
  sail:
    driver: bridge

volumes:
  prod-mariadb:
    driver: local
  prod-redis:
    driver: local
  laravel-storage:
    driver: local