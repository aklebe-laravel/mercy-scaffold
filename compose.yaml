services:
  mercy.app:
    dns:
      - '${VPN_DNS1:-8.8.8.8}'
      - '${VPN_DNS2:-1.1.1.1}'
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      # Dev uses the base stage only: the code is bind-mounted, nothing is copied into the image.
      # Without a target, Docker builds the last stage (production) and copies the whole project folder.
      target: base
      args:
        WWWGROUP: '${WWWGROUP}'
        MYSQL_CLIENT: mariadb-client
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - '${REVERB_HOST}:host-gateway'
    ports:
      - '${APP_PORT:-80}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
      - '${REVERB_SERVER_PORT:-27007}:${REVERB_SERVER_PORT:-27007}'
    environment:
      WWWUSER: '${WWWUSER}'
      VITE_PORT: '${VITE_PORT}'
      APP_PORT: '${APP_PORT}'
      APP_DOMAIN: '${APP_DOMAIN}'
      REVERB_SERVER_HOST: '${REVERB_SERVER_HOST:-0.0.0.0}'
      REVERB_SERVER_PORT: '${REVERB_SERVER_PORT:-27007}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - '.:/var/www/html'
      - './docker/app/nginx.conf:/etc/nginx/sites-available/default'
      # the target path contains the PHP version of the image (ARG PHP_VERSION in docker/app/Dockerfile)
      - './docker/app/php.ini:/etc/php/8.5/cli/conf.d/99-sail.ini'
      # Host-provided known_hosts + deploy key (read-only). Built by the installer
      # (syncDockerSsh) and consumed by "start-container". Same mechanism as PROD.
      # create_host_path: false -> fail fast instead of Docker creating a root-owned
      # empty directory on the host when the installer has not run yet.
      - type: bind
        source: '${SSH_DOCKER_DIR:-${HOME}/.ssh-docker}'
        target: /tmp/host-ssh
        read_only: true
        bind:
          create_host_path: false

      # Note: Mount business_imports on dev is moved to "start-container"!
      # Do not add './business_imports:/var/www/html/storage/app/imports:ro' here!
    networks:
      sail: { }
      proxy-gateway:
        aliases:
          - "app-${COMPOSE_PROJECT_NAME}.internal"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  mariadb:
    image: 'mariadb:11'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - 'sail-mariadb:/var/lib/mysql'
      - './docker/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
    networks:
      - sail
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'sail-redis:/data'
    networks:
      - sail
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 3

  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - sail

networks:
  sail:
    driver: bridge
  proxy-gateway:
    external: true

volumes:
  sail-mariadb:
    driver: local
  sail-redis:
    driver: local